    <text x="2" y="119" fill="#7cf4dc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="4">EXTERNAL RISK INTELLIGENCE</text>
    <path d="M2 161h390" stroke="#7cf4dc" stroke-width="3" stroke-linecap="round" opacity=".7"/>
