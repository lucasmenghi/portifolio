<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">RiskSense</title>
  <desc id="description">External risk intelligence represented by connected signals and a protective radar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081624"/>
      <stop offset="0.55" stop-color="#102c42"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="48%" r="46%">
